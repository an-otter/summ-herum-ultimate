<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <title>Eintrag bearbeiten</title>
</head>
<body style="font-family: sans-serif;">

<div th:replace="~{menu :: navbar}"></div>

<div style="max-width: 800px; margin: 0 auto;">

    <h1>✏️ Tagebucheintrag bearbeiten</h1>

    <div style="background-color: #e3f2fd; padding: 20px; border-radius: 10px; margin-bottom: 30px;">
        <form th:action="@{'/updateEntry/' + ${entry.id}}" method="post">

            <label>Titel:</label><br>
            <input type="text"
                   name="title"
                   th:value="${entry.title}"
                   required
                   style="width: 100%; padding: 5px;">
            <br><br>

            <label>Text:</label><br>
            <textarea name="text"
                      required
                      style="width: 100%; height: 120px; padding: 5px;"
                      th:text="${entry.text}">
            </textarea>
            <br><br>

            <label>Datum:</label><br>
            <input type="date"
                   name="date"
                   th:value="${entryDate}"
                   required>
            <br><br>

            <label>Reise:</label><br>
            <select name="journeyId" required style="padding: 5px; width: 300px;">
                <option th:each="journey : ${journeyListe}"
                        th:value="${journey.id}"
                        th:text="${journey.title}"
                        th:selected="${entry.journey != null and journey.id == entry.journey.id}">
                </option>
            </select>
            <br><br>

            <label>Ort:</label><br>
            <select name="locationId" required style="padding: 5px; width: 300px;">
                <option th:each="ort : ${orteListe}"
                        th:value="${ort.id}"
                        th:text="${ort.name}"
                        th:selected="${entry.location != null and ort.id == entry.location.id}">
                </option>
            </select>
            <br><br>

            <button type="submit"
                    style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer;">
                Änderungen speichern ✅
            </button>

            <a th:href="@{/entries}"
               style="margin-left: 10px; color: #555;">
                Abbrechen
            </a>

        </form>
    </div>

</div>

</body>
</html>
